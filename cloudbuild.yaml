# Cloud Build pipeline: build the container and deploy it to Cloud Run.
#
# Runs automatically on every push to master via the trigger
# "ToolMeUp-Trigger" (region us-central1, GitHub push, branch ^master$).
# The trigger is REGIONAL: use --region=us-central1 with
# `gcloud builds triggers list` / `gcloud builds list`.
#
# Manual run (only if the trigger is broken; use a clean checkout):
#   gcloud builds submit --region=us-central1 --config cloudbuild.yaml \
#     --substitutions=COMMIT_SHA=$(git rev-parse HEAD)
#
# See HANDOFF.md section 1 for checking and rolling back a deploy.
#
# Note: WHEEL_SIZE_KEY is intentionally NOT set below — `gcloud run deploy`
# without env flags preserves the value already configured on the service.

substitutions:
  _REGION: us-central1
  _SERVICE: toolmeup
  _REPO: toolmeup

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA"

steps:
  # 1) Build the image from the Dockerfile (tag with commit SHA + latest)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA"
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest"
      - .

  # 2) Push both tags to Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"

  # 3) Deploy to Cloud Run (preserves existing env vars, incl. WHEEL_SIZE_KEY)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
