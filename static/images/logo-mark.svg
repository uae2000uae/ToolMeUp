<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ToolMeUp">
  <!-- ToolMeUp mark: a 2x2 grid of tool tiles (a collection of tools), one
       tile per category colour family. Replaces the older wheel-fitment badge
       in the header; that artwork is kept as logo.svg / logo.png. -->
  <defs>
    <linearGradient id="tmu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tmu-bg)"/>
  <rect x="7" y="7" width="8" height="8" rx="2.2" fill="#fff"/>
  <rect x="17" y="7" width="8" height="8" rx="2.2" fill="#fff" fill-opacity=".55"/>
  <rect x="7" y="17" width="8" height="8" rx="2.2" fill="#fff" fill-opacity=".55"/>
  <rect x="17" y="17" width="8" height="8" rx="4" fill="#fbbf24"/>
</svg>
