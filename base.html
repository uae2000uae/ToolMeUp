<!--
  ToolMeUp • shared top navigation bar
  Injected by shared.js into <header class="app-header" data-shared-header>
  on every page. The tool links inside the menu are generated from the
  TOOLS list in shared.js — don't add them here.
  Per-page brand text comes from the header's data-brand attribute.
-->
<a class="brand" href="index.html" aria-label="ToolMeUp home">
  <img class="brand-logo" src="static/images/logo.svg" alt="" width="34" height="26">
  <span class="brand-text">ToolMeUp</span>
</a>
<div class="header-controls menu-wrap">
  <button id="paletteBtn" class="search-btn" type="button" aria-label="Search tools">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zm9 16l-4.3-4.3"/></svg>
    <span class="search-btn__label" data-t="nav_search">Search</span>
    <kbd class="kbd">Ctrl K</kbd>
  </button>
  <button id="menuBtn" class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-haspopup="true">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
  </button>
  <div id="menuDropdown" class="menu-dropdown" hidden>
    <nav class="menu-tools" data-tool-links aria-label="Tools"></nav>
    <div class="menu-sep"></div>
    <label class="toggle">
      <svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <span data-t="nav_dark">Dark</span>
      <input type="checkbox" id="themeToggle">
    </label>
    <label class="toggle">
      <svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c2.5 2.6 2.5 15.4 0 18-2.5-2.6-2.5-15.4 0-18z"/></svg>
      <span>العربية</span>
      <input type="checkbox" id="langToggle">
    </label>
  </div>
</div>
