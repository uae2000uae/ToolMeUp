<!--
  ToolMeUp • shared top navigation bar
  Injected by shared.js into <header class="app-header" data-shared-header>
  on every page. The tool links inside the menu are generated from the
  TOOLS list in shared.js — don't add them here.
  Per-page brand text comes from the header's data-brand attribute.
  Layout: [menu][brand] ……… [theme][language]. The menu is a drawer that
  slides in from the start side (left; right in Arabic). shared.js moves
  the drawer and its backdrop to <body> so they cover the whole page.
-->
<div class="header-start">
  <button id="menuBtn" class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menuDropdown" data-t-aria="nav_menu">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
  </button>
  <a class="brand" href="index.html" aria-label="ToolMeUp home">
    <img class="brand-logo" src="static/images/logo-mark.svg" alt="" width="28" height="28">
    <span class="brand-text">ToolMeUp</span>
  </a>
</div>
<div class="header-controls quick-settings">
  <!-- Quick settings: the hidden checkboxes keep their ids (#themeToggle,
       #langToggle) so existing page scripts keep working. -->
  <label class="quick-btn" title="Dark mode" data-t-title="nav_dark">
    <input type="checkbox" id="themeToggle" class="sr-only">
    <svg class="qi qi-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <svg class="qi qi-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
  </label>
  <label class="quick-btn quick-btn--lang" title="العربية / English">
    <input type="checkbox" id="langToggle" class="sr-only">
    <svg class="qi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c2.5 2.6 2.5 15.4 0 18-2.5-2.6-2.5-15.4 0-18z"/></svg>
    <span class="ql ql-ar" lang="ar">ع</span>
    <span class="ql ql-en">EN</span>
  </label>
</div>
<div id="menuBackdrop" class="menu-backdrop"></div>
<aside id="menuDropdown" class="menu-drawer" aria-label="Menu" aria-hidden="true">
  <div class="menu-drawer__head">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="static/images/logo-mark.svg" alt="" width="28" height="28">
      <span class="menu-drawer__title">ToolMeUp</span>
    </a>
    <button id="menuClose" class="menu-btn" type="button" aria-label="Close menu" data-t-aria="nav_close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="menu-tools" data-tool-links aria-label="Tools"></nav>
</aside>
