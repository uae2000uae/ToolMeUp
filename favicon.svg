      .p { fill: #e2e8f0; stroke: #475569; }
    }
  </style>
  <rect class="b1" transform="rotate(-82 12 52)" x="12" y="48.75" width="46" height="6.5" rx="3.25" fill="#d97706"/>
  <rect class="b2" transform="rotate(-67 12 52)" x="12" y="48.75" width="46" height="6.5" rx="3.25" fill="#e11d48"/>
  <rect class="b3" transform="rotate(-52 12 52)" x="12" y="48.75" width="46" height="6.5" rx="3.25" fill="#7c3aed"/>
  <rect class="b4" transform="rotate(-37 12 52)" x="12" y="48.75" width="46" height="6.5" rx="3.25" fill="#4f46e5"/>
  <rect class="b5" transform="rotate(-22 12 52)" x="12" y="48.75" width="46" height="6.5" rx="3.25" fill="#2563eb"/>
  <rect class="b6" transform="rotate(-7 12 52)" x="12" y="48.75" width="46" height="6.5" rx="3.25" fill="#0f766e"/>
  <circle class="p" cx="12" cy="52" r="6.5" fill="#ffffff" stroke="#334155" stroke-width="3"/>
