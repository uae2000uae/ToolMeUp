# Security headers for the main ToolMeUp pages (index, fitment, wget, ...).
# Included in every location that sets its own add_header, because nginx
# does not inherit server-level add_header into those locations.
#
# CSP notes:
# - script-src 'self': no inline scripts or on*= handlers on these pages.
#   wget.js loads JSZip on demand from three CDNs (with fallbacks).
# - style-src 'unsafe-inline': JS sets inline style attributes.
# - connect-src *: the Wget tool fetches whatever URL the user enters.
# - font-src 'self': Inter is served from static/fonts (no Google Fonts).
# - Google sign-in (account.js, Firebase Auth): the auth SDK loads
#   apis.google.com/js/api.js and talks to the project's auth domain in a
#   hidden iframe (frame-src toolmeup-accounts.firebaseapp.com, the
#   free Spark-plan Firebase project that holds accounts); profile photos come from
#   *.googleusercontent.com. Firestore/Auth API calls are covered by connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com; frame-src https://toolmeup-accounts.firebaseapp.com; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
