# Security headers for the main ToolMeUp pages (index, fitment, wget, ...).
# Included in every location that sets its own add_header, because nginx
# does not inherit server-level add_header into those locations.
#
# CSP notes:
# - script-src 'self': no inline scripts or on*= handlers on these pages.
#   wget.js loads JSZip on demand from three CDNs (with fallbacks).
# - style-src 'unsafe-inline': JS sets inline style attributes.
# - connect-src *: the Wget tool fetches whatever URL the user enters.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
